[project]
name = "retail-competitive-intel-agent"
version = "0.1.0"
description = "Multi-agent ADK system that compares Walmart with its top retail competitors using public data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk==2.12.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "SQLAlchemy[asyncio]==2.1.5",
    "aiosqlite==0.22.1",
    "google-cloud-secret-manager==2.31.0",
    "opentelemetry-exporter-gcp-trace==1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
eval = [
    "google-adk[eval]==2.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
